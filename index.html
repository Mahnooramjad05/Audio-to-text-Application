<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcription Pipeline</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" />
  <style>
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f5f4ef;
      --color-background-tertiary: #faf9f5;
      --color-text-primary: #1d1c1a;
      --color-text-secondary: #6b6a66;
      --color-text-info: #0c447c;
      --color-border-primary: #b8b6ad;
      --color-border-secondary: #c8c6bd;
      --color-border-tertiary: #ebe9e1;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--color-text-primary);
      background: var(--color-background-tertiary);
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
    }
    button {
      font-family: inherit;
      font-size: 13px;
      background: var(--color-text-primary);
      color: var(--color-background-primary);
      border: 0.5px solid var(--color-border-primary);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.88; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    select, input[type="text"] {
      font-family: inherit;
      font-size: 13px;
      padding: 7px 9px;
      border-radius: 6px;
      border: 0.5px solid var(--color-border-secondary);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      outline: none;
    }
    select:focus, input:focus { border-color: var(--color-text-primary); }
    input[type="checkbox"] {
      accent-color: var(--color-text-primary);
      width: 14px; height: 14px;
      cursor: pointer;
    }
    code {
      background: rgba(0,0,0,0.04);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 0.9em;
    }
    pre code { background: transparent; padding: 0; }
    a { color: var(--color-text-info); }
  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
